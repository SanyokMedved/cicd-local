services:
  drupal:
    image: drupal:11-apache
    container_name: "${BRANCH_NAME:-source}_drupal"
    env_file:
      - .env
    volumes:
      - ./html:/var/www/html
    depends_on:
      - db
    networks:
      - branch_network
      - traefik_network
    restart: unless-stopped
    
    # 🚀 ДОБАВЛЯЕМ МЕТКИ ДЛЯ АВТОМАТИЧЕСКОГО СВЯЗЫВАНИЯ С TRAEFIK
    labels:
      - "traefik.enable=true"
      # Создаем уникальное имя роутера для каждой ветки (например, feature-2_router)
      - "traefik.http.routers.${BRANCH_NAME:-source}_router.rule=Host(`${BRANCH_NAME:-source}.docker`)"
      - "traefik.http.routers.${BRANCH_NAME:-source}_router.entrypoints=web"
      # Указываем внутренний порт контейнера Drupal (Apache по умолчанию слушает 80)
      - "traefik.http.services.${BRANCH_NAME:-source}_service.loadbalancer.server.port=80"

  db:
    image: mysql:8.0
    container_name: "${BRANCH_NAME:-source}_db"
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - branch_network
    restart: unless-stopped

volumes:
  db_data:
    name: "${BRANCH_NAME:-source}_db_data"

networks:
  branch_network:
    name: "${BRANCH_NAME:-source}_network"
    driver: bridge
  traefik_network:
    name: traefik_network
    external: true
