name: CI/CD Pipeline (Master & Feature Branches)

on:
  push:
    branches:
      - master
      - '*' # Отслеживаем пуш во все остальные ветки
  delete:
    branches:
      - '*' # Отслеживаем удаление веток для очистки окружений

jobs:
  # ==========================================
  # 1. СТАДИЯ ПРОВЕРКИ (Запускается для ВСЕХ веток при пуше)
  # ==========================================
  validate:
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Code Linting & Static Analysis
        run: |
          echo "Запуск линтеров (phpcs / eslint)..."
          # Здесь будут ваши команды проверки, например:
          # ./vendor/bin/phpcs --standard=Drupal ./html
          echo "Проверка синтаксиса успешна!"

      - name: Run Unit Tests
        run: |
          echo "Запуск юнит-тестов..."
          # Пример: ./vendor/bin/phpunit
          echo "Все тесты пройдены!"


  # ==========================================
  # 2. ДЕПЛОЙ НА ПРОД (Только для ветки master)
  # ==========================================
  deploy-production:
    needs: validate
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: self-hosted
    steps:
      - name: Deploy to Destination (Production)
        run: |
          echo "Переходим в папку прод-сервера..."
          cd "/Users/oleksandr/Sites/cicd/destination"
          
          echo "Стягиваем свежий код из master..."
          git fetch origin master
          git reset --hard origin/master

      - name: Production Build & Cache Clear
        run: |
          cd "/Users/oleksandr/Sites/cicd/destination"
          echo "Сборка окружения и очистка кэша..."
          # Если используется docker-compose на проде, можно запустить:
          # docker-compose up -d --build
          # Очистка кэша Drupal:
          # docker-compose exec -T drupal drush cr
          echo "🚀 Деплой на Прод (Destination) успешно завершен!"


  # ==========================================
  # 3. ДЕПЛОЙ ФИЧ-ВЕТОК (Для всех веток, кроме master)
  # ==========================================
  deploy-feature-branch:
    needs: validate
    if: github.event_name == 'push' && github.ref_name != 'master'
    runs-on: self-hosted
    steps:
      - name: Get clean branch name
        id: branch-name
        run: |
          CLEAN_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9_-]/_/g' | tr '[:upper:]' '[:lower:]')
          echo "branch=${CLEAN_NAME}" >> $GITHUB_OUTPUT

      - name: Deploy or Update Feature Environment
        run: |
          BRANCH="${{ steps.branch-name.outputs.branch }}"
          BASE_DIR="/Users/oleksandr/Sites/cicd/branches"
          TARGET_DIR="$BASE_DIR/$BRANCH"
          
          echo "Развертывание ветки $BRANCH..."
          
          if [ -d "$TARGET_DIR" ]; then
            echo "Окружение существует. Обновляем код..."
            cd "$TARGET_DIR"
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
          else
            echo "Новое окружение. Клонируем ветку..."
            mkdir -p "$BASE_DIR"
            git clone --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git "$TARGET_DIR"
          fi
          
          cd "$TARGET_DIR"
          ls -la docker-compose.yml
          
          echo "BRANCH_NAME=$BRANCH" > .env
          echo "MYSQL_ROOT_PASSWORD=root" >> .env
          echo "MYSQL_DATABASE=drupal" >> .env
          
          echo "Запуск Docker контейнеров..."
          BRANCH_NAME=$BRANCH docker-compose up -d --build
          
          echo "Обновляем конфиг Traefik..."
          if grep -q "^\s*$BRANCH:" /Users/oleksandr/Sites/cicd/traefik/traefik-config.yml; then
            echo "Branch уже в Traefik config"
          else
            cat >> /Users/oleksandr/Sites/cicd/traefik/traefik-config.yml << 'TRAEFIK'

    $BRANCH:
      rule: Host(`$BRANCH.docker`)
      entryPoints:
        - web
      service: $BRANCH
  
  services:
    $BRANCH:
      loadBalancer:
        servers:
          - url: http://${BRANCH}_drupal:80
TRAEFIK
            docker restart traefik
          fi
          
          echo "🚀 Сборка фичи готова! Ссылка: http://$BRANCH.docker"

  # ==========================================
  # 4. УДАЛЕНИЕ ОКРУЖЕНИЯ (При удалении ветки в Git)
  # ==========================================
  cleanup-feature-branch:
    if: github.event_name == 'delete' && github.event.ref != 'master'
    runs-on: self-hosted
    steps:
      - name: Get deleted branch name
        id: branch-name
        run: |
          CLEAN_NAME=$(echo "${{ github.event.ref }}" | sed 's/[^a-zA-Z0-9_-]/_/g' | tr '[:upper:]' '[:lower:]')
          echo "branch=${CLEAN_NAME}" >> $GITHUB_OUTPUT

      - name: Destroy Docker Containers and Folder
        run: |
          BRANCH="${{ steps.branch-name.outputs.branch }}"
          TARGET_DIR="/Users/oleksandr/Sites/cicd/branches/$BRANCH"
          
          if [ -d "$TARGET_DIR" ]; then
            echo "Удаляем окружение для ветки $BRANCH..."
            
            cd "$TARGET_DIR"
            # 🚀 ИСПРАВЛЕНИЕ: Передаем BRANCH_NAME перед down, чтобы Docker знал какой волюм удалять
            BRANCH_NAME=$BRANCH docker-compose down -v
            
            cd ..
            rm -rf "$TARGET_DIR"
            echo "🧹 Окружение $BRANCH полностью удалено."
          else
            echo "Папка для ветки $BRANCH не найдена, очистка не требуется."
          fi