name: CI/CD Pipeline (Master & Feature Branches)

on:
  push:
    branches:
      - master
      - '*' # Отслеживаем пуш во все остальные ветки
  delete:
    branches:
      - '*' # Отслеживаем удаление веток для очистки окружений

jobs:
  # ==========================================
  # 1. СТАДИЯ ПРОВЕРКИ (Запускается для ВСЕХ веток при пуше)
  # ==========================================
  validate:
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Code Linting & Static Analysis
        run: |
          echo "Запуск линтеров (phpcs / eslint)..."
          echo "Проверка синтаксиса успешна!"

      - name: Run Unit Tests
        run: |
          echo "Запуск юнит-тестов..."
          echo "Все тесты пройдены!"

  # ==========================================
  # 2. ДЕПЛОЙ НА ПРОД (Только для ветки master)
  # ==========================================
  deploy-production:
    needs: validate
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: self-hosted
    steps:
      - name: Deploy to Destination (Production)
        run: |
          echo "Переходим в папку прод-сервера..."
          cd "/Users/oleksandr/Sites/cicd/destination"
          
          echo "Стягиваем свежий код из master..."
          git fetch origin master
          git reset --hard origin/master

      - name: Production Build & Cache Clear
        run: |
          cd "/Users/oleksandr/Sites/cicd/destination"
          echo "Сборка окружения и очистка кэша..."
          BRANCH_NAME=destination docker-compose up -d --build
          echo "🚀 Деплой на Прод (Destination) успешно завершен!"

      - name: Run Production Initialization Script
        run: |
          cd "/Users/oleksandr/Sites/cicd/destination"
          if [ -f "run.sh" ]; then
            echo "📝 Executing production run.sh..."
            docker exec destination_drupal /bin/bash -c 'cd /var/www/html && bash run.sh' &
            PRODUCTION_RUN_PID=$!
            sleep 5
            echo "✅ Production lifecycle manager started (PID: $PRODUCTION_RUN_PID)"
          fi

  # ==========================================
  # 3. ДЕПЛОЙ ФИЧ-ВЕТОК (Для всех веток, кроме master)
  # ==========================================
  deploy-feature-branch:
    needs: validate
    if: github.event_name == 'push' && github.ref_name != 'master'
    runs-on: self-hosted
    steps:
      - name: Get clean branch name
        id: branch-name
        run: |
          CLEAN_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9_-]/_/g' | tr '[:upper:]' '[:lower:]')
          echo "branch=${CLEAN_NAME}" >> $GITHUB_OUTPUT

      - name: Deploy or Update Feature Environment
        run: |
          BRANCH="${{ steps.branch-name.outputs.branch }}"
          BASE_DIR="/Users/oleksandr/Sites/cicd/branches"
          TARGET_DIR="$BASE_DIR/$BRANCH"
          
          echo "Развертывание ветки $BRANCH..."
          
          if [ -d "$TARGET_DIR" ]; then
            echo "Окружение существует. Обновляем код..."
            cd "$TARGET_DIR"
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
          else
            echo "Новое окружение. Клонируем ветку..."
            mkdir -p "$BASE_DIR"
            git clone --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git "$TARGET_DIR"
          fi
          
          cd "$TARGET_DIR"
          
          ls -la docker-compose.yml
          
          echo "BRANCH_NAME=$BRANCH" > .env
          echo "MYSQL_ROOT_PASSWORD=root" >> .env
          echo "MYSQL_DATABASE=drupal" >> .env
          
          echo "Запуск Docker контейнеров под управлением Traefik..."
          BRANCH_NAME=$BRANCH docker-compose up -d --build
          
          echo "⏳ Waiting for containers to stabilize..."
          sleep 5
          
          echo "🌍 Branch environment ready at: http://$BRANCH.docker"

      - name: Initialize Database (First Time Only)
        run: |
          BRANCH="${{ steps.branch-name.outputs.branch }}"
          TARGET_DIR="/Users/oleksandr/Sites/cicd/branches/$BRANCH"
          
          if [ -f "$TARGET_DIR/init-db.sh" ]; then
            echo "📊 Running database initialization..."
            cd "$TARGET_DIR"
            export MYSQL_ROOT_PASSWORD="root"
            export MYSQL_DATABASE="drupal"
            bash init-db.sh "$BRANCH" "/Users/oleksandr/Sites/cicd/source" "$TARGET_DIR"
            echo "✅ Database initialization complete"
          fi

      - name: Add Traefik Route for Branch
        run: |
          BRANCH="${{ steps.branch-name.outputs.branch }}"
          echo "📝 Adding Traefik route for $BRANCH.docker..."
          bash /Users/oleksandr/Sites/cicd/scripts/add-traefik-route.sh "$BRANCH" "/Users/oleksandr/Sites/cicd/traefik/config/branches.yml"
          sleep 2

      - name: Start Lifecycle Manager (run.sh)
        run: |
          BRANCH="${{ steps.branch-name.outputs.branch }}"
          TARGET_DIR="/Users/oleksandr/Sites/cicd/branches/$BRANCH"
          
          if [ -f "$TARGET_DIR/run.sh" ]; then
            echo "🚀 Starting lifecycle manager for branch $BRANCH..."
            docker exec ${BRANCH}_drupal /bin/bash -c 'cd /var/www/html && bash run.sh' > /tmp/branch-${BRANCH}-output.log 2>&1 &
            RUN_SH_PID=$!
            sleep 3
            echo "✅ Lifecycle manager started (PID: $RUN_SH_PID)"
            echo "📝 Logs: /tmp/branch-${BRANCH}-output.log"
            
            # Store PID for cleanup job
            echo "$RUN_SH_PID" > /tmp/.${BRANCH}-run-pid
          fi

  # ==========================================
  # 4. УДАЛЕНИЕ ОКРУЖЕНИЯ (При удалении ветки в Git)
  # ==========================================
  cleanup-feature-branch:
    if: github.event_name == 'delete' && github.event.ref != 'master'
    runs-on: self-hosted
    steps:
      - name: Get deleted branch name
        id: branch-name
        run: |
          CLEAN_NAME=$(echo "${{ github.event.ref }}" | sed 's/[^a-zA-Z0-9_-]/_/g' | tr '[:upper:]' '[:lower:]')
          echo "branch=${CLEAN_NAME}" >> $GITHUB_OUTPUT

      - name: Checkout code (for cleanup scripts)
        uses: actions/checkout@v4

      - name: Remove Traefik Route for Branch
        run: |
          BRANCH="${{ steps.branch-name.outputs.branch }}"
          echo "🗑️  Removing Traefik route for $BRANCH.docker..."
          bash /Users/oleksandr/Sites/cicd/scripts/remove-traefik-route.sh "$BRANCH" "/Users/oleksandr/Sites/cicd/traefik/config/static-routes.yml"

      - name: Stop Lifecycle Manager
        run: |
          BRANCH="${{ steps.branch-name.outputs.branch }}"
          
          echo "🛑 Stopping lifecycle manager for branch $BRANCH..."
          
          # Try to kill the run.sh process gracefully
          if [ -f "/tmp/.${BRANCH}-run-pid" ]; then
            PID=$(cat /tmp/.${BRANCH}-run-pid)
            kill -TERM $PID 2>/dev/null || true
            rm -f "/tmp/.${BRANCH}-run-pid"
            sleep 2
          fi
          
          # Also try to kill via container name
          docker exec ${BRANCH}_drupal killall bash 2>/dev/null || true

      - name: Destroy Docker Containers and Folder
        run: |
          BRANCH="${{ steps.branch-name.outputs.branch }}"
          TARGET_DIR="/Users/oleksandr/Sites/cicd/branches/$BRANCH"
          
          if [ -d "$TARGET_DIR" ]; then
            echo "Удаляем окружение для ветки $BRANCH..."
            cd "$TARGET_DIR"
            
            # Передаем имя ветки для корректного удаления связанных волюмов
            BRANCH_NAME=$BRANCH docker-compose down -v
            
            cd ..
            rm -rf "$TARGET_DIR"
            echo "🧹 Окружение $BRANCH полностью удалено."
            
            # Cleanup logs and markers
            rm -f "/tmp/branch-${BRANCH}-output.log"
            rm -f "/tmp/branch-${BRANCH}-run.log"
            rm -f "/tmp/.${BRANCH}-running"
          else
            echo "Папка для ветки $BRANCH не найдена, очистка не требуется."
          fi
